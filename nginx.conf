# Nginx Production Configuration for ihaleciburada.com
# Hardened Security, Compression, Caching, and Dotfile Protection

server {
    listen 80;
    listen [::]:80;
    server_name ihaleciburada.com www.ihaleciburada.com;

    # 1. HTTP -> HTTPS Yönlendirmesi (Strict Redirect)
    return 301 https://www.ihaleciburada.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ihaleciburada.com;

    # SSL Sertifikaları (Örnek Let's Encrypt yolları)
    ssl_certificate /etc/letsencrypt/live/ihaleciburada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ihaleciburada.com/privkey.pem;

    # Naked Domain -> www Yönlendirmesi
    return 301 https://www.ihaleciburada.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ihaleciburada.com;

    # 2. SSL & TLS Güçlendirmesi
    ssl_certificate /etc/letsencrypt/live/ihaleciburada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ihaleciburada.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 3. SENTINEL PENTEST: Güvenlik Başlıkları (Defense-in-Depth)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-DNS-Prefetch-Control "on" always;

    # 4. GİZLİ VE HASSAS DOSYA ENGELLEME (Dotfile & Sensitive Files Block)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # RFC 9116 security.txt ve well-known istisnası
    location ^~ /.well-known/ {
        allow all;
    }

    # 5. GZIP & BROTLI SIKIŞTIRMA (Core Web Vitals TTFB & LCP Optimizasyonu)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 6. STATİK VARLIKLAR İÇİN UZUN ÖMÜRLÜ ÖNBELLEK
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }

    # 7. NUXT 4 / NITRO UYGULAMA TERS VEKİLİ (REVERSE PROXY)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
